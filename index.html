<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jurnal Trading</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TJr">

<style>
:root{--bg:#f4f6fa;--card:#fff;--side:#fff;--tx:#151a24;--mu:#6b7385;--bd:#e3e7ef;--ac:#2563eb;--pos:#12a150;--neg:#e5484d;--in:#f0f3f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1017;--card:#161b26;--side:#121722;--tx:#e8ecf4;--mu:#8b94a8;--bd:#252c3b;--ac:#5b8def;--pos:#2fd07a;--neg:#ff6b6f;--in:#1d2432}}
:root[data-theme="dark"]{--bg:#0d1017;--card:#161b26;--side:#121722;--tx:#e8ecf4;--mu:#8b94a8;--bd:#252c3b;--ac:#5b8def;--pos:#2fd07a;--neg:#ff6b6f;--in:#1d2432}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh;max-width:100%;overflow-x:hidden}
aside{width:260px;background:var(--side);border-right:1px solid var(--bd);padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.logo img{height:58px;width:auto;flex:none}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo img{filter:drop-shadow(0 0 1px #fff)}}:root[data-theme="dark"] .logo img{filter:drop-shadow(0 0 1px #fff)}.lt{display:flex;flex-direction:column;line-height:1.15}.lt b{font-size:15px}.lt small{font-size:9px;color:var(--mu);font-weight:500}.mk{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--ac),#7c3aed);color:#fff;border-radius:11px;padding:5px 10px;font-weight:800;font-size:19px;letter-spacing:-.5px;line-height:1.2}.mk i{font-style:normal;color:#ffd166}.mk b{font-weight:800}.mk small{font-size:13px;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
.ic{border:1px solid var(--bd);background:var(--in);border-radius:10px;width:36px;height:36px}
.prof{background:var(--in);border-radius:14px;padding:14px;text-align:center}
.av{width:64px;height:64px;border-radius:50%;background:var(--ac);color:#fff;font-size:26px;font-weight:700;display:grid;place-items:center;margin:0 auto 8px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.prof b{display:block}.prof small{color:var(--mu)}
.pb{display:flex;gap:6px;margin-top:10px}
.pb button{flex:1;font-size:12.5px;padding:7px 4px;border-radius:9px;border:1px solid var(--bd);background:var(--card)}
nav{display:flex;flex-direction:column;gap:2px}
nav button{text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px;color:var(--mu);display:flex;gap:10px;align-items:center}
nav button:hover{background:var(--in)}
nav button.on{background:var(--ac);color:#fff}
main{flex:1;padding:24px;min-width:0;max-width:1100px;overflow-x:hidden}
h1{margin:0 0 16px;font-size:22px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:28px;font-weight:700}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mu{color:var(--mu)}
.dn{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dn svg{width:120px;height:120px;flex:none}
.lg div{display:flex;align-items:center;gap:8px;font-size:13.5px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
input,select{font:inherit;color:inherit;background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%}
label{display:block;font-size:12.5px;color:var(--mu);margin:10px 0 4px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;margin-top:14px;font-weight:600}
.btn.sec{background:var(--in);color:var(--tx);border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);font-size:14px}
th{color:var(--mu);font-weight:600;font-size:12.5px}
.sc{overflow-x:auto}
.cal{touch-action:none;user-select:none;min-width:0;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{text-align:center;font-size:12px;color:var(--mu)}
.d{min-height:62px;border:1px solid var(--bd);border-radius:10px;padding:5px 6px;font-size:12px;background:var(--in)}
.d{cursor:pointer;min-width:0;overflow:hidden;padding:4px 4px;font-size:11px}.d.sel{outline:2px solid var(--ac)}.btn.bad{background:var(--neg)}.tabs{display:inline-flex;background:var(--in);border-radius:10px;padding:3px}.tabs button{border:0;background:none;padding:6px 14px;border-radius:8px;color:var(--mu)}.tabs button.on{background:var(--ac);color:#fff}.bar2{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.flt{display:flex;gap:8px;flex-wrap:wrap}.flt>*{width:auto}.flt input[list]{min-width:0;width:100%;max-width:220px}.flt .btn{margin:0;padding:8px 12px}.d.w{background:color-mix(in srgb,var(--pos) 18%,transparent)}
.d.l{background:color-mix(in srgb,var(--neg) 18%,transparent)}
.d b{display:block;margin-top:2px;font-size:10.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:12px;border-radius:8px;background:var(--in);overflow:hidden;margin:10px 0}
.bar div{height:100%;background:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:none;color:var(--mu);font-size:18px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px;z-index:9}
.mo>div{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow:auto;border:1px solid var(--bd)}
.acc{display:flex;gap:10px;align-items:center;width:100%;padding:10px;border:1px solid var(--bd);background:var(--in);border-radius:12px;margin-bottom:8px;text-align:left}
.acc.on{border-color:var(--ac)}.acc .av{width:36px;height:36px;font-size:15px;margin:0}
@media(max-width:820px){.app{flex-direction:column}aside{width:100%;height:auto;position:static;border-right:0;border-bottom:1px solid var(--bd)}nav{flex-direction:row;overflow-x:auto;overscroll-behavior-x:contain;max-width:100%}nav button{white-space:nowrap;flex:none}main{padding:16px;max-width:100vw}}
</style>
</head>

const isWk=d=>{const w=new Date(d+'T00:00:00').getDay();return w==0||w==6};

function seed(){const n=new Date(),y=n.getFullYear(),m=n.getMonth();

 .map((a,i)=>({id:i+1,date:iso(y,m,a[0]),time:String(9+i%8).padStart(2,'0')+(i%2?':30':':00'),inst:a[1],side:a[2],pnl:a[3]}));
 return{accounts:[{id:1,name:'Trader Utama',photo:'',start:10000,goals:{hari:100,minggu:500,bulan:2000,tahun:20000},tx:[{id:1,date:iso(y,m,1),type:'dep',amt:500}],trades:t}],active:1,theme:null,view:'dash',cy:y,cm:m,p:'bulan',f:{inst:'all',from:'',to:''},hist:0,sel:null}}

if(!S||!S.accounts)S=seed();
if(!S.dr)S.dr={from:'',to:''};
const save=()=>{try{localStorage.setItem('tj5',JSON.stringify(S))}catch(e){}};
const A=()=>S.accounts.find(a=>a.id==S.active)||S.accounts[0];
function rng(p){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate();
 if(p=='hari')return[td(),td()];
 if(p=='minggu'){const w=(n.getDay()+6)%7;return[fd(new Date(y,m,d-w)),fd(new Date(y,m,d-w+6))]}
 if(p=='bulan')return[iso(y,m,1),iso(y,m,new Date(y,m+1,0).getDate())];
 return[iso(y,0,1),iso(y,11,31)]}
const inR=(x,r)=>x>=r[0]&&x<=r[1];
const P=ts=>ts.filter(t=>inR(t.date,rng(S.p)));

function st(t){let gp=0,gl=0,w=0,l=0;t.forEach(x=>{if(x.pnl>0){gp+=x.pnl;w++}else if(x.pnl<0){gl+=-x.pnl;l++}});const n=t.length;return{gp,gl,w,l,n,net:gp-gl,wr:n?Math.round(w/n*1000)/10:0}}

const sumTx=(l,ty)=>l.filter(x=>x.type==ty).reduce((s,x)=>s+x.amt,0);
const balOf=a=>a.start+st(a.trades).net+sumTx(a.tx,'dep')-sumTx(a.tx,'wd');

   if(!date||!inst||isNaN(pnl)){skip++;return}

   if(!date||isNaN(amt)||amt<=0)return;
   tx.push({id:Date.now()+100000+i,date,type:/tarik/i.test(jenis)?'wd':'dep',amt});
  });
  if(!trades.length){msg('Tidak ada baris trade yang valid ditemukan di file ini.');el.value='';return}
  const parts=[trades.length+' trade'];if(shX)parts.push('deposit/penarikan');if(acc)parts.push('modal awal, nama akun, dan target');
  ask('Impor akan mengganti '+parts.join(', ')+' pada akun ini dengan isi file'+(skip?' ('+skip+' baris trade dilewati karena tidak lengkap)':'')+'. Lanjutkan?',()=>{

function pick(el){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);tmp=c.toDataURL('image/jpeg',.85);$('#pv').innerHTML=`<img src="${tmp}" alt="">`};im.src=rd.result};rd.readAsDataURL(f)}
function saveP(){const a=A();a.name=$('#pn').value.trim()||a.name;a.photo=tmp;save();cm();r()}

function sw(id){S.active=id;S.sel=null;save();cm();r()}
function newA(){const n=$('#na').value.trim();if(!n)return;const id=Date.now();S.accounts.push({id,name:n,photo:'',start:10000,goals:{hari:100,minggu:500,bulan:2000,tahun:20000},tx:[],trades:[]});S.active=id;S.sel=null;save();cm();r()}
